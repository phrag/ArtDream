name: Sources check

on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Fails if any museum or Wikimedia API stops answering or changes shape.
      - name: Check art source APIs
        run: ./scripts/check-sources.sh
